# render.yaml - Blueprint do Render
# Documentação: https://render.com/docs/blueprint-spec

services:
  # ============ BACKEND ============
  - type: web
    name: cabapua-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: ./backend
    plan: starter
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cabapua-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: APP_NAME
        value: Cabapua API
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SECRET_KEY
        generateValue: true
    disk:
      name: uploads
      mountPath: /app/uploads
      sizeGB: 1

  # ============ FRONTEND ============
  - type: web
    name: cabapua-frontend
    env: docker
    dockerfilePath: ./cabapua-app/Dockerfile.render
    dockerContext: ./cabapua-app
    plan: starter
    region: oregon
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NODE_VERSION
        value: 20.11.0
      - key: HOST
        value: 0.0.0.0

databases:
  - name: cabapua-db
    plan: starter
    region: oregon
    databaseName: cabapua
    user: cabapua_user
    ipAllowList: []
    readReplicas: []
